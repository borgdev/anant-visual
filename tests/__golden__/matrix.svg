<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" class="av-mx" width="920" height="640" role="img"><title>What to build next</title><desc>A caption long enough to state the concept the figure makes, as the contract requires of every figure. SVG export (High Impact, Low Effort). Nested groups (High Impact, Low Effort). Network graphs (High Impact, High Effort). Pan and zoom (Low Impact, High Effort). Icons (Low Impact, Low Effort). 3D charts (Low Impact, High Effort). Positions show relative standing, not measured values.</desc><style>.av-mx{--av-font:Inter,system-ui,sans-serif}.av-mx text{font-family:var(--av-font,inherit)}.av-mx .pulse{opacity:0}</style><rect width="920" height="640" fill="#ffffff"/><g class="region"><rect x="120" y="50" width="760" height="494" rx="14" fill="#285cc2" stroke="#d4d4d4" fill-opacity="0.03" stroke-width="1.5"/><path class="line" d="M500,50 L500,544" fill="none" stroke="#d4d4d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><path class="line" d="M120,297 L880,297" fill="none" stroke="#d4d4d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><text x="500" y="588.55" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="0.65" fill="#555555">EFFORT</text><text x="120" y="588.9" text-anchor="start" font-size="14" font-weight="400" fill="#555555">Low</text><text x="880" y="588.9" text-anchor="end" font-size="14" font-weight="400" fill="#555555">High</text><text x="66" y="301.55" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="0.65" transform="rotate(-90 66 297)" fill="#555555">IMPACT</text><text x="106" y="544.9" text-anchor="end" font-size="14" font-weight="400" fill="#555555">Low</text><text x="106" y="68.9" text-anchor="end" font-size="14" font-weight="400" fill="#555555">High</text><text x="136" y="78.38" text-anchor="start" font-size="12.5" font-weight="600" letter-spacing="0.6" fill="#555555">DO NEXT</text><text x="864" y="78.38" text-anchor="end" font-size="12.5" font-weight="600" letter-spacing="0.6" fill="#555555">PLAN</text><text x="136" y="534.38" text-anchor="start" font-size="12.5" font-weight="600" letter-spacing="0.6" fill="#555555">MAYBE</text><text x="864" y="534.38" text-anchor="end" font-size="12.5" font-weight="600" letter-spacing="0.6" fill="#555555">SKIP</text></g><g class="node" data-id="a"><path d="M263,99.39999999999999 a9,9 0 1 0 18,0 a9,9 0 1 0 -18,0 Z" fill="#006b2b" stroke="#006b2b" fill-opacity="0.2" stroke-width="4.5" stroke-linejoin="round"/><text x="289" y="105" text-anchor="start" font-size="16" font-weight="600" fill="#0a0a0a">SVG export</text></g><g class="node" data-id="b"><path d="M339,173.5 a9,9 0 1 0 18,0 a9,9 0 1 0 -18,0 Z" fill="#285cc2" stroke="#285cc2" fill-opacity="0.2" stroke-width="4.5" stroke-linejoin="round"/><text x="365" y="179.1" text-anchor="start" font-size="16" font-weight="600" fill="#0a0a0a">Nested groups</text></g><g class="node" data-id="c"><path d="M719,198.20000000000002 a9,9 0 1 0 18,0 a9,9 0 1 0 -18,0 Z" fill="#285cc2" stroke="#285cc2" fill-opacity="0.2" stroke-width="4.5" stroke-linejoin="round"/><text x="711" y="203.8" text-anchor="end" font-size="16" font-weight="600" fill="#0a0a0a">Network graphs</text></g><g class="node" data-id="d"><path d="M643,371.1 a9,9 0 1 0 18,0 a9,9 0 1 0 -18,0 Z" fill="#7e4700" stroke="#7e4700" fill-opacity="0.2" stroke-width="4.5" stroke-linejoin="round"/><text x="669" y="376.7" text-anchor="start" font-size="16" font-weight="600" fill="#0a0a0a">Pan and zoom</text></g><g class="node" data-id="e"><path d="M225,395.79999999999995 a9,9 0 1 0 18,0 a9,9 0 1 0 -18,0 Z" fill="#285cc2" stroke="#285cc2" fill-opacity="0.2" stroke-width="4.5" stroke-linejoin="round"/><text x="251" y="401.4" text-anchor="start" font-size="16" font-weight="600" fill="#0a0a0a">Icons</text></g><g class="node" data-id="f"><path d="M795,494.6 a9,9 0 1 0 18,0 a9,9 0 1 0 -18,0 Z" fill="#b00c15" stroke="#b00c15" fill-opacity="0.2" stroke-width="4.5" stroke-linejo