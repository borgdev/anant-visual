<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 548" class="av-tl" width="936" height="548" role="img"><title>How the library grew</title><desc>A caption long enough to state the concept the figure makes, as the contract requires of every figure. Step 1: Scene model (One drawing for page and file). Step 2: Nested groups (Cloud, VPC, subnet). Step 3: Swimlanes. Step 4: New figure kinds. Step 5: Charts on the scene. Phase: Foundation (from Scene model to Nested groups). Phase: Breadth (from Swimlanes to Charts on the scene). Events are shown in order, not to scale.</desc><style>.av-tl{--av-font:Inter,system-ui,sans-serif}.av-tl text{font-family:var(--av-font,inherit)}.av-tl .pulse{opacity:0}</style><rect width="936" height="548" fill="#ffffff"/><g class="region"><rect x="56" y="458" width="320" height="28" rx="8" fill="#285cc2" fill-opacity="0.12"/><text x="216" y="476.9" text-anchor="middle" font-size="14" font-weight="600" fill="#555555">Foundation</text></g><g class="region"><rect x="392" y="496" width="488" height="28" rx="8" fill="#285cc2" fill-opacity="0.12"/><text x="636" y="514.9" text-anchor="middle" font-size="14" font-weight="600" fill="#555555">Breadth</text></g><g class="edge" data-t="start end"><path class="line" d="M24,228 L912,228" fill="none" stroke="#285cc2" stroke-width="4.5" stroke-linecap="round" pathLength="1"/><polygon class="head" points="912,228 899.2,234.4 899.2,221.6" fill="#285cc2"/><circle class="pulse" r="5.5" fill="#285cc2" style="offset-path:path('M24,228 L912,228')"/></g><g class="node" data-id="a:marker" data-t="a"><path d="M123,228 a9,9 0 1 0 18,0 a9,9 0 1 0 -18,0 Z" fill="#ffffff" stroke="#285cc2" stroke-width="4.5" stroke-linejoin="round"/><path d="M128.5,228 a3.5,3.5 0 1 0 7,0 a3.5,3.5 0 1 0 -7,0 Z" fill="#285cc2"/><path class="line" d="M132,220 L132,182" fill="none" stroke="#d4d4d4" stroke-width="1.5" stroke-linecap="round" pathLength="1"/></g><g class="node" data-id="a:when" data-t="a"><text x="132" y="261.25" text-anch