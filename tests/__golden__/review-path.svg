<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344.8 246" class="av-review-path" width="1344.8" height="246" role="img"><title>How a change is reviewed</title><desc>A caption long enough to state the concept the figure makes, as the contract requires of every figure. Author leads to Independent review. Independent review: Two people, not the author leads to Production (approved); Author (rejected). Production leads to Audit log. Audit log leads to Auditor. Auditor</desc><style>.av-review-path{--av-font:Inter,system-ui,sans-serif}.av-review-path text{font-family:var(--av-font,inherit)}.av-review-path .pulse{opacity:0}</style><rect width="1344.8" height="246" fill="#ffffff"/><g class="region"><rect x="830.8" y="6" width="482" height="164" rx="20" fill="#285cc2" fill-opacity="0.04"/><text x="844.8" y="26.29" text-anchor="start" font-size="12.6" font-weight="600" letter-spacing="0.63" fill="#555555">OUTSIDE OUR CONTROL</text></g><g class="edge" data-t="author review"><path class="line" d="M238,101 C273,101 273,101 308,101" fill="none" stroke="#285cc2" stroke-width="3" stroke-linecap="round" pathLength="1"/><polygon class="head" points="308,101 295.2,107.4 295.2,94.6" fill="#285cc2"/><circle class="pulse" r="5.5" fill="#285cc2" style="offset-path:path('M238,101 C273,101 273,101 308,101')"/></g><g class="edge" data-t="review ship"><path class="line" d="M498,101 C542.4,101 542.4,101 586.8,101" fill="none" stroke="#285cc2" stroke-width="4.5" stroke-linecap="round" pathLength="1"/><polygon class="head" points="586.8,101 574,107.4 574,94.6" fill="#285cc2"/><circle class="pulse" r="5.5" fill="#285cc2" style="offset-path:path('M498,101 C542.4,101 542.4,101 586.8,101')"/></g><g class="edge" data-t="review author"><path class="line" d="M403,154 C403,180.4 143,180.4 143,154" fill="none" stroke="#285cc2" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><polygon class="head" points="143,154 149.4,166.8 136.6,166.8" fill="#285cc2"/><circle class="pulse" r="5.5" fill="#285cc2" style="offset-path:path('M403,154 C403,180.4 143,180.4 143,154')"/></g><g class="edge" data-t="ship log"><path class="line" d="M776.8,101 C811.8,101 811.8,101 846.8,101" fill="none" stroke="#285cc2" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><polygon class="head" points="846.8,101 834,107.4 834,94.6" fill="#285cc2"/><circle class="pulse" r="5.5" fill="#285cc2" style="offset-path:path('M776.8,101 C811.8,101 811.8,101 846.8,101')"/></g><g class="edge" data-t="log audit"><path class="line" d="M1036.8,101 C1071.8,101 1071.8,101 1106.8,101" fill="none" stroke="#285cc2" stroke-width="3" stroke-linecap="round" pathLength="1"/><polygon class="head" points="1106.8,101 1094,107.4 1094,94.6" fill="#285cc2"/><circle class="pulse" r="5.5" fill="#285cc2" style="offset-path:path('M1036.8,101 C1071.8,101 1071.8,101 1106.8,101')"/></g><g class="node" data-id="author" data-t="author review"><rect x="48" y="48" width="190" height="106" rx="16" fill="#ffffff"/><rect x="48" y="48" width="190" height="106" rx="16" fill="none" stroke="#d4d4d4" stroke-width="1.5"/><text x="143" y="107.3" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Author</text></g><g class="node" data-id="review" data-t="review author ship"><rect x="308" y="48" width="190" height="106" rx="16" fill="#ffffff"/><rect x="308" y="48" width="190" height="106" rx="16" fill="#285cc2" stroke="#285cc2" fill-opacity="0.12" stroke-opacity="0.5" stroke-width="3"/><text x="403" y="76.55" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Independent</text><text x="403" y="99.05" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">review</text><text x="403" y="120.9" text-anchor="middle" font-size="14" font-weight="400" fill="#555555">Two people, not the</text><text x="403" y="138.9" text-anchor="middle" font-size="14" font-weight="400" fill="#555555">author</text></g><g class="node" data-id="ship" data-t="ship review log"><rect x="586.8" y="48" width="190" height="106" rx="53" fill="#ffffff"/><rect x="586.8" y="48" width="190" height="106" rx="53" fill="#006b2b" stroke="#006b2b" fill-opacity="0.1" stroke-opacity="0.3" stroke-width="1.5"/><text x="681.8" y="107.3" text-anchor="middle" font-size="18" font-weight="600" fill="#006b2b">Production</text></g><g class="node" data-id="audit" data-t="audit log"><rect x="1106.8" y="48" width="190" height="106" rx="16" fill="#ffffff"/><rect x="1106.8" y="48" width="190" height="106" rx="16" fill="none" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="7 6"/><text x="1201.8" y="107.3" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Auditor</text></g><g class="node" data-id="log" data-t="log ship audit"><rect x="846.8" y="48" width="190" height="106" rx="16" fill="#ffffff"/><rect x="846.8" y="48" width="190" height="106" rx="16" fill="#7e4700" stroke="#7e4700" fill-opacity="0.1" stroke-opacity="0.3" stroke-width="1.5"/><text x="941.8" y="107.3" text-anchor="middle" font-size="18" font-weight="600" fill="#7e4700">Audit log</text></g><g class="edge-label" data-t="review ship"><rect x="507.31" y="90.19" width="70.18" height="21.63" rx="4" fill="#ffffff"/><text x="542.4" y="105.66" text-anchor="middle" font-size="13.3" font-weight="500" fill="#555555">approved</text></g><g class="edge-label" data-t="review author"><rect x="237.91" y="162.99" width="70.18" height="21.63" rx="4" fill="#ffffff"/><text x="273" y="178.46" text-anchor="middle" font-size="13.3" font-weight="500" fill="#555555">rejected</text></g></svg>