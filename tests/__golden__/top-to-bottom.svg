<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 286 568" class="av-pipeline" width="286" height="568" role="img"><title>A pipeline</title><desc>A caption long enough to state the concept the figure makes, as the contract requires of every figure. Ingest leads to Validate. Validate leads to Transform. Transform leads to Publish. Publish</desc><style>.av-pipeline{--av-font:Inter,system-ui,sans-serif}.av-pipeline text{font-family:var(--av-font,inherit)}.av-pipeline .pulse{opacity:0}</style><rect width="286" height="568" fill="#ffffff"/><g class="edge" data-t="ingest validate"><path class="line" d="M143,124 C143,152 143,152 143,180" fill="none" stroke="#285cc2" stroke-width="3" stroke-linecap="round" pathLength="1"/><polygon class="head" points="143,180 136.6,167.2 149.4,167.2" fill="#285cc2"/><circle class="pulse" r="5.5" fill="#285cc2" style="offset-path:path('M143,124 C143,152 143,152 143,180')"/></g><g class="edge" data-t="validate transform"><path class="line" d="M143,256 C143,284 143,284 143,312" fill="none" stroke="#285cc2" stroke-width="3" stroke-linecap="round" pathLength="1"/><polygon class="head" points="143,312 136.6,299.2 149.4,299.2" fill="#285cc2"/><circle class="pulse" r="5.5" fill="#285cc2" style="offset-path:path('M143,256 C143,284 143,284 143,312')"/></g><g class="edge" data-t="transform publish"><path class="line" d="M143,388 C143,416 143,416 143,444" fill="none" stroke="#285cc2" stroke-width="3" stroke-linecap="round" pathLength="1"/><polygon class="head" points="143,444 136.6,431.2 149.4,431.2" fill="#285cc2"/><circle class="pulse" r="5.5" fill="#285cc2" style="offset-path:path('M143,388 C143,416 143,416 143,444')"/></g><g class="node" data-id="ingest" data-t="ingest validate"><rect x="48" y="48" width="190" height="76" rx="16" fill="#ffffff"/><rect x="48" y="48" width="190" height="76" rx="16" fill="none" stroke="#d4d4d4" stroke-width="1.5"/><text x="143" y="92.3" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Ingest</text></g><g class="node" data-id="validate" data-t="validate ingest transform"><rect x="48" y="180" width="190" height="76" rx="16" fill="#ffffff"/><rect x="48" y="180" width="190" height="76" rx="16" fill="none" stroke="#d4d4d4" stroke-width="1.5"/><text x="143" y="224.3" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Validate</text></g><g class="node" data-id="transform" data-t="transform validate publish"><rect x="48" y="312" width="190" height="76" rx="16" fill="#ffffff"/><rect x="48" y="312" width="190" height="76" rx="16" fill="none" stroke="#d4d4d4" stroke-width="1.5"/><text x="143" y="356.3" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Transform</text></g><g class="node" data-id="publish" data-t="publish transform"><rect x="48" y="444" width="190" height="76" rx="16" fill="#ffffff"/><rect x="48" y="444" width="190" height="76" rx="16" fill="none" stroke="#d4d4d4" stroke-width="1.5"/><text x="143" y="488.3" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Publish</text></g></svg>